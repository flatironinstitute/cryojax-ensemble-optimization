name: Build and push container

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.3.6

      - name: Login to Sylabs
        run: |
          echo "${{ secrets.SYLABS_TOKEN }}" > /tmp/sylabs_token
          apptainer remote add --no-login SylabsCloud https://cloud.sylabs.io
          apptainer remote login --tokenfile /tmp/sylabs_token SylabsCloud
          rm /tmp/sylabs_token

      - name: Build container
        run: sudo apptainer build container/cryojax_eo.sif container/cryojax_eo.def

      - name: Import signing key
        run: |
          printf '%s\n' "${{ secrets.APPTAINER_PRIVATE_KEY }}" > /tmp/private.key
          apptainer key import /tmp/private.key
          rm /tmp/private.key

      - name: Sign container
        env:
          APPTAINER_KEY_PASSPHRASE: ${{ secrets.APPTAINER_KEY_PASSPHRASE }}
        run: apptainer sign container/cryojax_eo.sif

      - name: Push to Sylabs (latest and version tag)
        run: |
          apptainer push container/cryojax_eo.sif library://davidsilva27/default/cryojax_eo:latest
          apptainer push container/cryojax_eo.sif library://davidsilva27/default/cryojax_eo:${{ github.ref_name }}
