# Parameters marked with (*) are optional

path_to_atomic_model: /path/to/atomic_model.pdb                         # initial structure to refine (.pdb or .cif)
path_to_prealigned_atomic_model: /path/to/prealigned_atomic_model.pdb   # reference structure aligned to the consensus map

path_to_output: ./flexible_fitting_output/

atom_selection: "not element H"  # (*) Default: "all". mdtraj selection string, or a .txt/.npy file of atom indices
loads_b_factors: false            # (*) Default: false. Load Debye-Waller b-factors from the PDB

reference_volume_params:
  path_to_reference_volume: /path/to/reference_volume.mrc  # consensus map (.mrc) used for alignment and fitting
  flexible_fitting_box_size: 128  # (*) Default: 128. Box size (pixels) for the cross-correlation loss
  rigid_alignment_box_size: 32    # (*) Default: 32.  Box size (pixels) for rigid-body re-alignment
  reference_volume_voxel_size:    # (*) Default: null. Override the voxel size stored in the MRC header
  path_to_volumetric_mask:        # (*) Default: null. Mask (.mrc) applied to the loss, cropped to flexible_fitting_box_size
  path_to_weights:                # (*) Default: null. Fourier weights (.mrc) that switch the loss to weighted MSE

projector_params:
  n_steps: 1000                    # number of MD integration steps per iteration
  bias_constant_in_kjpermol: 3.0e5 # biasing force constant (kJ/mol); might require tuning
# bias_constant_in_kjpermol:       # linear schedule: ramps from start to end over n_steps iterations
#   - 1.0e5                        #   start value
#   - 5.0e5                        #   end value
  platform: CUDA
  platform_properties:
    DeviceIndex: '0'
# platform: CPU                    # CPU version
# platform_properties:
#   Threads: '32'                  # can be unreliable, OpenMM does not always use all available threads
  path_to_initial_state:           # (*) Default: null. OpenMM state XML for warm-starting (e.g., from a prior run)
  md_params:                       # (*) Override default OpenMM simulation parameters. All fields are optional.
    forcefield: amber14-all.xml       # (*) Default: amber14-all.xml
    water_model: amber14/tip3p.xml    # (*) Default: amber14/tip3p.xml
    nonbonded_method: CutoffNonPeriodic # (*) Options: PME, CutoffNonPeriodic, NoCutoff, CutoffPeriodic, Ewald, LJPME
    nonbonded_cutoff_nm: 1.0          # (*) Default: 1.0 nm
    constraints: HBonds               # (*) Options: HBonds, AllBonds, HAngles, null (no constraints)
    temperature_K: 300.0              # (*) Default: 300 K
    friction_per_ps: 1.0              # (*) Default: 1.0 ps^-1
    timestep_ps: 0.002                # (*) Default: 0.002 ps (2 fs)

walker_optimizer_params:
  type: steepest_desc   # (*) Default: steepest_desc. Options: steepest_desc, adam
  n_steps: 10           # (*) Default: 1. Number of gradient descent steps per iteration
  step_size: 2.0        # step size in Angstroms
  n_batches_of_atoms: 1       # (*) Default: 1. Increase to reduce GPU memory usage
  volume_render_backend:      # (*) How walkers are rendered onto the voxel grid when computing the loss and its gradient. Every field is optional
    spread_mode: local        # (*) Default: local. 'local' spreads each gaussian onto its nearby voxels only; 'exact' evaluates dense gaussian integrals over the whole grid
    spread_width_in_stds: 6.0 # (*) Default: 6.0. Truncation width of the spreading, in standard deviations of the gaussian. Ignored when spread_mode is 'exact'
    enable_pallas: false      # (*) Default: false. Use the Pallas/Triton GPU kernels instead of pure JAX. Requires a CUDA GPU, and only applies when spread_mode is 'local'

early_stopping:         # (*) Default: null (never stop early). Omit the whole block to disable
  patience: 10          # required when the block is present. Iterations without improvement before stopping
  rtol: 1.0e-4          # (*) Default: 1.0e-4. Relative tolerance on the loss
  atol: 1.0e-4          # (*) Default: 1.0e-4. Absolute tolerance on the loss

n_steps: 100  # total number of flexible fitting iterations
rng_seed: 0   # (*) Default: 0. Seeds the OpenMM Langevin thermostat; 0 keeps OpenMM's default of a fresh seed each run
